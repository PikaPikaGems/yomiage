# Node tests and type checks on every push and pull request. kakera is checked out next to yomiage, where
# package.json expects it (file:../kakera). The voice model that `npm run files` downloads is cached between runs.
name: Test

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yomiage
    steps:
      - uses: actions/checkout@v4
        with:
          path: yomiage
      - uses: actions/checkout@v4
        with:
          repository: PikaPikaGems/kakera
          path: kakera
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: yomiage/.cache
          key: voice-model-${{ hashFiles('yomiage/scripts/make-files.mjs') }}
      - run: npm ci
        working-directory: kakera
      - run: npm ci
      - run: npm run build
      - run: npm run files
      - run: npm test
      - run: npm run test:types
