# Publishes a GitHub release for the version in package.json, either
#   - when a version tag is pushed (git tag -a v0.3.4 -m "<notes>" && git push origin v0.3.4): the tag's message
#     becomes the release notes, or
#   - from "Run workflow" on main (Actions tab, or the API): it creates the tag v<version> on that commit, and the
#     `notes` input becomes the release notes. For tools that can start a workflow but not push tags.
# Builds and tests like test.yml, then attaches the npm tarball and the voice files that `yomiage copy-files` downloads,
# followed in the notes by the install lines every release carries.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (Markdown)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yomiage
    steps:
      - uses: actions/checkout@v4
        with:
          path: yomiage
      - uses: actions/checkout@v4
        with:
          repository: PikaPikaGems/kakera
          path: kakera
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: yomiage/.cache
          key: voice-model-${{ hashFiles('yomiage/scripts/make-files.mjs') }}
      - name: Version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::run it on main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
              echo "::error::v$version already exists: bump the version in package.json first"
              exit 1
            fi
          elif [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: kakera
      - run: npm ci
      - run: npm run build
      - run: npm run files
      - run: npm test
      - run: npm run test:types
      - run: npm pack
      - name: Release notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' "$INPUT_NOTES" > notes.md
          else
            # actions/checkout leaves an annotated tag as a plain ref: fetch it again to read its message.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          fi
          base="https://github.com/PikaPikaGems/yomiage"
          cat >> notes.md <<NOTES

          Install: \`npm install $base/releases/download/v$VERSION/yomiage-$VERSION.tgz\`
          Then \`yomiage copy-files public/yomiage\` (in predev/prebuild) gets the voice files attached here (65 MB). See the [README]($base/blob/v$VERSION/README.md#nothing-downloads-until-the-user-says-so) and [API.md]($base/blob/v$VERSION/API.md). Demo: https://pikapikagems.github.io/yomiage/
          Every app must show the Tsukuyomi-chan credit (\`CREDIT\`, see NOTICE.md).
          NOTES
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target: from "Run workflow" the tag does not exist yet; gh creates it on this commit.
          gh release create "$TAG" "yomiage-$VERSION.tgz" files/* --target "$GITHUB_SHA" \
            --prerelease --title "yomiage $VERSION (experimental)" --notes-file notes.md
